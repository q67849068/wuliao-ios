workflows:
  ios-release:
    name: 无聊畅谈 iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lingguangsh.wuliao
      vars:
        BUNDLE_ID: com.lingguangsh.wuliao
        XCODE_PROJECT: WuliaoChat.xcodeproj
        XCODE_SCHEME: WuliaoChat
    scripts:
      - name: 安装 XcodeGen
        script: |
          brew install xcodegen

      - name: 生成 Xcode 工程
        script: |
          xcodegen generate
          ls -la

      - name: 应用签名配置
        script: |
          xcode-project use-profiles

      - name: 编译并打包 IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - support@lingguangsh.com
        notify:
          success: true
          failure: true
