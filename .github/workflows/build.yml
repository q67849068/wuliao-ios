name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 导入签名证书
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          # 解码 p12
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          # 创建临时钥匙串
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "build" build.keychain
          # 解码描述文件
          echo "$PROVISION_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 编译并打包 IPA
        run: |
          xcodebuild -project WuliaoChat.xcodeproj \
            -scheme WuliaoChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/WuliaoChat.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=FB5HJF43H7 \
            PROVISIONING_PROFILE_SPECIFIER="wuliao_appstore" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | xcpretty || xcodebuild -project WuliaoChat.xcodeproj -scheme WuliaoChat -configuration Release -sdk iphoneos -derivedDataPath build -archivePath build/WuliaoChat.xcarchive archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=FB5HJF43H7

      - name: 导出 IPA
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>FB5HJF43H7</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/WuliaoChat.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WuliaoChat-ipa
          path: build/ipa/*.ipa
