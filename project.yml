name: WuliaoChat
options:
  bundleIdPrefix: com.lingguangsh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: FB5HJF43H7
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"

targets:
  WuliaoChat:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguangsh.wuliao
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        CODE_SIGN_IDENTITY: "Apple Distribution"
